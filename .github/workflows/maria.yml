name: maria

on:
  push:
    paths: ["server/maria/**"]
  pull_request:
    paths: ["server/maria/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/maria
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/maria/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m compileall -q app tests evals finetune
      - run: python -m pytest tests -q
