name: api

on:
  push:
    paths: ["server/crates/**", "server/migrations/**", "server/Cargo.*", ".github/workflows/api.yml"]
  pull_request:
    paths: ["server/crates/**", "server/migrations/**", "server/Cargo.*", ".github/workflows/api.yml"]

jobs:
  quality:
    runs-on: ubuntu-latest
    # Postgres efêmero para os e2e `#[sqlx::test]` (fluxo crítico de
    # reserva) — mesmo schema das migrations reais.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clarituz
          POSTGRES_PASSWORD: clarituz
          POSTGRES_DB: clarituz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clarituz -d clarituz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://clarituz:clarituz@localhost:5432/clarituz
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      # Gate de cobertura (ver docs/cobertura.md). Medido em 18/11/2026:
      # domain 40.5% linhas, application 12.6% linhas — pisos abaixo
      # seguram o nível atual com folga para variação entre plataformas
      # enquanto o roadmap para 70% no domínio avança.
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cobertura — clarituz-domain (piso 35%, meta 70%)
        run: cargo llvm-cov -p clarituz-domain --summary-only --fail-under-lines 35
      - name: Cobertura — clarituz-application (piso 10%, meta 70%)
        run: cargo llvm-cov -p clarituz-application --summary-only --fail-under-lines 10
      # rustsec/audit-check@v2 quebra no input 'ignore' (Unexpected end of
      # JSON input). Rodamos cargo audit direto — ele le os ignores
      # justificados em server/.cargo/audit.toml.
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
