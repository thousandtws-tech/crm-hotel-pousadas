name: api

on:
  push:
    paths: ["server/crates/**", "server/migrations/**", "server/Cargo.*", ".github/workflows/api.yml"]
  pull_request:
    paths: ["server/crates/**", "server/migrations/**", "server/Cargo.*", ".github/workflows/api.yml"]

jobs:
  quality:
    runs-on: ubuntu-latest
    # Postgres efêmero para os e2e `#[sqlx::test]` (fluxo crítico de
    # reserva) — mesmo schema das migrations reais.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clarituz
          POSTGRES_PASSWORD: clarituz
          POSTGRES_DB: clarituz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clarituz -d clarituz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://clarituz:clarituz@localhost:5432/clarituz
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: server
          # rsa/libsqlite3-sys: deps opcionais do sqlx (mysql/sqlite off) — nao compilam.
          # quick-xml 0.38: DoS em XML nao-confiavel; so lemos respostas S3/STS
          # via TLS e nao usamos NsReader. Preso por aws-creds 0.39, sem bump.
          ignore: |
            RUSTSEC-2023-0071
            RUSTSEC-2026-0459
            RUSTSEC-2026-0194
            RUSTSEC-2026-0195
