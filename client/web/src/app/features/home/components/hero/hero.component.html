<section class="relative w-full h-[92svh] lg:h-[88vh] min-h-[560px] lg:min-h-[620px] max-h-[1100px] flex items-center overflow-hidden bg-[#032B38] pt-20">
  <!-- Dominant Editorial Background Image with Parallax Scale -->
  <div class="absolute inset-0 z-0 overflow-hidden">
    <img
      src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80"
      srcset="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80 800w,
              https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80 1200w,
              https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80 1600w,
              https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2400&q=80 2400w"
      sizes="100vw"
      alt="Vista litorânea representando a região da Praia do Peró em Cabo Frio"
      class="hero-bg-img w-full h-full object-cover object-center filter brightness-[0.78]"
      fetchpriority="high"
    />
    <!-- Brand Deep Navy Ocean Gradient Overlay -->
    <div class="absolute inset-0 bg-gradient-to-t from-[#032B38]/95 via-[#032B38]/45 to-[#032B38]/20"></div>
  </div>

  <!-- Editorial Lower-Left Content Block -->
  <div class="relative z-10 container-editorial w-full flex flex-col items-start justify-end">
    <div class="hero-content max-w-3xl">
      <span class="hero-eyebrow type-eyebrow !text-white !text-xs sm:!text-sm lg:!text-base block mb-3">
        Bairro Peró · Cabo Frio, RJ
      </span>

      <!-- Monumental Editorial Heading -->
      <h1 class="hero-title font-serif text-4xl sm:text-5xl md:text-6xl lg:text-[4.25rem] text-white font-normal leading-[1.06] tracking-[-0.02em] mb-4 sm:mb-5">
        {{ titulo() }}
      </h1>

      <!-- Precise, Uncluttered Human Sentence -->
      <p class="hero-subtitle text-base sm:text-lg text-white font-light leading-relaxed max-w-xl mb-6 sm:mb-7">
        {{ subtitulo() }}
      </p>

      <!-- Primary & Secondary CTAs -->
      <div class="hero-ctas flex flex-wrap items-center gap-4 sm:gap-5">
        <a
          routerLink="/reservar"
          class="btn-secondary-light group"
        >
          <span>Consultar disponibilidade</span>
          <app-icon name="arrow-right" [size]="14" class="transition-transform duration-300 group-hover:translate-x-1 text-[#ffff]"></app-icon>
        </a>

        <a
          routerLink="/acomodacoes"
          class="text-sm text-white/85 hover:text-[#ffff] transition-colors underline underline-offset-8 decoration-white/30 hover:decoration-[#DDA554]"
        >
          Conheça nossas acomodações
        </a>
      </div>
    </div>
  </div>
</section>
