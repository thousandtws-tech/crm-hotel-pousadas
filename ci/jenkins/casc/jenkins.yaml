jenkins:
  systemMessage: "CI do Clarituz — push na main dispara deploy dos serviços afetados no Railway"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "${JENKINS_URL}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "railway-token"
              secret: "${RAILWAY_TOKEN}"
              description: "Project token do Railway — autentica `railway up` no pipeline"
          - usernamePassword:
              scope: GLOBAL
              id: "github-token"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
              description: "PAT do GitHub — clone do repo privado"
          - usernamePassword:
              scope: GLOBAL
              id: "pg-backup-pg"
              username: "${PG_BACKUP_USER}"
              password: "${PG_BACKUP_PASSWORD}"
              description: "Credencial do Postgres para o pg_dump diário"
          - usernamePassword:
              scope: GLOBAL
              id: "pg-backup-s3"
              username: "${S3_BACKUP_KEY}"
              password: "${S3_BACKUP_SECRET}"
              description: "Chave MinIO para upload dos dumps"

jobs:
  - script: >
      pipelineJob('clarituz-deploy') {
        triggers {
          githubPush()
          scm('H/10 * * * *')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/thousandtws-tech/crm-hotel-pousadas.git')
                  credentials('github-token')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
  - script: >
      pipelineJob('pg-backup') {
        displayName('pg-backup — dump diário do Postgres para o MinIO')
        triggers {
          cron('H 3 * * *')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/thousandtws-tech/crm-hotel-pousadas.git')
                  credentials('github-token')
                }
                branch('*/main')
              }
            }
            scriptPath('ci/jenkins/pg-backup.Jenkinsfile')
            lightweight(true)
          }
        }
      }
