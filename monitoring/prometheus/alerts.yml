groups:
  # Avaliadas a cada 15s (evaluation_interval no prometheus.yml)
  - name: clarituz-api
    rules:
      - alert: ApiFora
        expr: up{job="api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API sem responder ao scrape há 2min"

      - alert: ApiErros5xx
        expr: >-
          sum(rate(axum_http_requests_total{status=~"5.."}[5m]))
          / sum(rate(axum_http_requests_total[5m])) > 0.02
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Taxa de 5xx acima de 2%"

      - alert: ApiP95Alto
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(axum_http_requests_duration_seconds_bucket[5m]))
          ) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 da API acima de 800ms por 10min"

      - alert: DbPoolSaturado
        expr: >-
          clarituz_db_pool_idle == 0
          and clarituz_db_pool_connections >= clarituz_db_pool_max
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pool do Postgres esgotado ({{ $value }} conexões, 0 ociosas) — subir réplicas ou DB_MAX_CONNECTIONS"

      - alert: SseAltaDemanda
        expr: clarituz_sse_subscribers > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} subscribers SSE — checar saturação da réplica"

  - name: clarituz-infra
    rules:
      - alert: MariaFora
        expr: up{job="maria"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MAR IA sem responder ao scrape há 2min"

      - alert: PostgresFora
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Postgres inalcançável pelo exporter"

      - alert: PgConexoesAlta
        expr: sum(pg_stat_activity_count) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Postgres com {{ $value }} conexões — teto seguro ~80% do max_connections"

  - name: clarituz-backup
    rules:
      # Falha pontual: uma execução quebrou — warning (a próxima pode
      # se curar sozinha, mas convém olhar o log).
      - alert: BackupPgFalhou
        expr: increase(maria_backup_pg_erros_total[6h]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} execuções do dump Postgres falharam nas últimas 6h"

      - alert: BackupDadosFalhou
        expr: increase(maria_backup_dados_erros_total[6h]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} execuções do backup do data/ falharam nas últimas 6h"

      # Ausência silenciosa — O alerta crítico do DR: falha visível é
      # metade do risco; a outra metade é backup que "roda" sem gravar
      # nada (credencial expirada, bucket apagado, task morta). 26h
      # cobre a janela diária ~04:00 UTC com folga e dá à implantação
      # recém-subida um ciclo inteiro para produzir o primeiro dump.
      # count_over_time > 100 exige a série viva pela janela inteira —
      # sem isso um deploy recém-subido (contador 0, série jovem) abriria
      # falso positivo na primeira hora.
      - alert: BackupPgAusente
        expr: >-
          increase(maria_backup_pg_ok_total[26h]) == 0
          and count_over_time(maria_backup_pg_ok_total[26h]) > 100
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Nenhum dump Postgres concluído nas últimas 26h — DR sem rede de segurança"

      - alert: BackupDadosAusente
        expr: >-
          increase(maria_backup_dados_ok_total[26h]) == 0
          and count_over_time(maria_backup_dados_ok_total[26h]) > 100
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Nenhum backup do data/ concluído nas últimas 26h"
